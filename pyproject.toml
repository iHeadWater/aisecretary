[project]
name = "aisecretary"
version = "0.2.0"
description = "Transaction database service with MCP tools for Hermes AI agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "mcp>=1.0.0,<2",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]

